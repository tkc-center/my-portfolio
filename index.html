<!DOCTYPE html>
<html>
<head>
    <script>

        const userLang = navigator.language || navigator.userLanguage;

        if (userLang.startsWith('fr')) {
            window.location.href = '/my-portfolio/fr/';
        }
        else if (userLang.startsWith('de')) {
            window.location.href = '/my-portfolio/de/';
        }
        else {
            window.location.href = '/my-portfolio/en/';
        }

    </script>
</head>
<body>
</body>
</html>
